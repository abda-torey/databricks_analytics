# azure-pipelines/ci-pipeline.yml
trigger: none

pr:
  branches:
    include:
      - main
      - staging
      - dev

pool:
  name: laptop-pool

variables:
  PYTHON_EXE: 'C:\Users\Torey\AppData\Local\Programs\Python\Python314\'

steps:
  - script: |
      $(PYTHON_EXE) --version
      $(PYTHON_EXE) -m pip install --upgrade pip
    displayName: 'Verify Global Python'

  - script: |
      $(PYTHON_EXE) -m venv venv
      venv\Scripts\python.exe -m pip install --upgrade pip
      venv\Scripts\pip.exe install -r requirements.txt
    displayName: 'Install dependencies in Venv'

  - script: |
      if exist venv\Scripts\flake8.exe (
        venv\Scripts\flake8.exe src/ --max-line-length=120
      ) else (
        echo flake8 not found in venv
        exit 1
      )
    displayName: 'Lint'

  - script: |
      venv\Scripts\pytest.exe src/tests/ -v --cov=src --cov-report=xml
    displayName: 'Unit tests'

  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: TerraformTaskV4@4
    displayName: Terraform Init
    inputs:
      command: init
      workingDirectory: infrastructure/terraform/environments/dev
      backendServiceArm: 'azure-service-connection'
      backendAzureRmResourceGroupName: 'rg-terraform-state'
      backendAzureRmStorageAccountName: 'stdbricsanaltrfrm'
      backendAzureRmContainerName: 'tfstate'
      backendAzureRmKey: 'dev.terraform.tfstate'

  - task: TerraformTaskV4@4
    displayName: Terraform Plan
    inputs:
      command: plan
      workingDirectory: infrastructure/terraform/environments/dev
      environmentServiceNameAzureRM: 'azure-service-connection'