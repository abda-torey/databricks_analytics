trigger:
  branches:
    include:
      - dev

pr:
  branches:
    include:
      - dev

pool:
  name: laptop-pool

variables:
  - group: databricks-analytics-dev-secrets
  - name: PYTHON_EXE
    value: 'C:\Users\Torey\AppData\Local\Programs\Python\Python314\python.exe'

steps:
  # 1. SMART LOCAL SYNC (Replaces Cache@2 to avoid timeouts)
  - script: |
      if not exist venv (
        echo "Venv missing. Creating..."
        "$(PYTHON_EXE)" -m venv venv
        venv\Scripts\python.exe -m pip install --upgrade pip
      )
      echo "Syncing requirements..."
      venv\Scripts\pip.exe install -r requirements.txt
    displayName: 'Fast Local Dependency Sync'

  - script: |
      if exist venv\Scripts\flake8.exe (
        venv\Scripts\flake8.exe src/ --max-line-length=120
      ) else (
        echo flake8 not found in venv
        exit 1
      )
    displayName: 'Lint'

  - script: |
      venv\Scripts\pytest.exe src/tests/ -v --cov=src --cov-report=xml
      if %errorlevel% equ 5 exit 0
    displayName: 'Unit tests'

  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: TerraformTaskV4@4
    displayName: Terraform Init
    inputs:
      command: init
      workingDirectory: infrastructure/terraform/environments/dev
      backendServiceArm: 'azure-service-connection'
      backendAzureRmResourceGroupName: 'rg-terraform-state'
      backendAzureRmStorageAccountName: 'stdbricsanaltrfrm'
      backendAzureRmContainerName: 'tfstate'
      backendAzureRmKey: 'dev.terraform.tfstate'

  - task: TerraformTaskV4@4
    displayName: Terraform Plan
    inputs:
      command: plan
      workingDirectory: infrastructure/terraform/environments/dev
      environmentServiceNameAzureRM: 'azure-service-connection'
    env:
      TF_VAR_tenant_id: $(AZURE_TENANT_ID)
      TF_VAR_subscription_id: $(AZURE_SUBSCRIPTION_ID)

  # 2. AUTOMATED APPLY (Only runs on merges to 'dev')
  - task: TerraformTaskV4@4
    displayName: Terraform Apply
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    inputs:
      command: apply
      workingDirectory: infrastructure/terraform/environments/dev
      environmentServiceNameAzureRM: 'azure-service-connection'
    env:
      TF_VAR_tenant_id: $(AZURE_TENANT_ID)
      TF_VAR_subscription_id: $(AZURE_SUBSCRIPTION_ID)